name: vuln

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: uv.lock
      - run: uv sync --locked --only-group ci
      - name: Audit the locked runtime dependencies
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project --output-file "$RUNNER_TEMP/locked.txt"
          uv run --no-sync pip-audit --strict --disable-pip --require-hashes --requirement "$RUNNER_TEMP/locked.txt"
