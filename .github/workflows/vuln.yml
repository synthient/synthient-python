name: vuln

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          cache-suffix: vuln
      - run: uv sync --locked --only-group ci
      - name: Audit the locked runtime dependencies
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project --output-file "$RUNNER_TEMP/locked.txt"
          uv run --no-sync pip-audit --strict --disable-pip --require-hashes --requirement "$RUNNER_TEMP/locked.txt"
      - name: Audit the lowest allowed runtime dependencies
        if: ${{ !cancelled() }}
        run: |
          uv export --resolution lowest-direct --all-extras --no-dev --no-emit-project --output-file "$RUNNER_TEMP/lowest.txt"
          uv run --no-sync pip-audit --strict --disable-pip --require-hashes --requirement "$RUNNER_TEMP/lowest.txt"
